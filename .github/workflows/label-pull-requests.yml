name: Label pull requests

on:
  pull_request_target:

# limit permissions
permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
      with:
        sync-labels: false